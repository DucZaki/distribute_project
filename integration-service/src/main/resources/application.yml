server:
  port: 8087

spring:
  application:
    name: integration-service
  mvc:
    async:
      request-timeout: 90s
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

news:
  api-key: ${NEWS_API_KEY:}
  base-url: https://newsapi.org/v2

amadeus:
  client-id: ${AMADEUS_CLIENT_ID:}
  client-secret: ${AMADEUS_CLIENT_SECRET:}
  base-url: ${AMADEUS_BASE_URL:https://test.api.amadeus.com}

chat:
  groq-key: ${GROQ_API_KEY:}
  groq-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  groq-model: ${GROQ_MODEL:llama-3.1-8b-instant}
  openrouter-key: ${OPENROUTER_API_KEY:}
  openrouter-url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
  openrouter-model: ${OPENROUTER_MODEL:google/gemini-2.0-flash-exp:free}
  gemini-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}

resilience4j:
  circuitbreaker:
    instances:
      news:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      amadeus:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      chat:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
