server:
  port: 8081

spring:
  application:
    name: identity-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookingtour_identity?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

spring.security.oauth2.client.registration.google.client-id: ${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope: email,profile
spring.security.oauth2.client.registration.facebook.client-id: ${FACEBOOK_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.facebook.client-secret: ${FACEBOOK_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.facebook.scope: public_profile,email
spring.security.oauth2.client.provider.facebook.user-info-uri: https://graph.facebook.com/me?fields=id,name,email

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  oauth:
    frontend-redirect: ${OAUTH_FRONTEND_REDIRECT:http://localhost:5173/oauth/callback}
  jwt:
    secret: ${JWT_SECRET:bookingtour-super-secret-key-change-in-prod-min-256-bits-required-aaaa}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: bookingtour

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
