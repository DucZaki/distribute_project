global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bookingtour-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'discovery:8761'
          - 'config:8888'
          - 'gateway:8080'
          - 'identity:8081'
          - 'tour:8082'
          - 'booking:8083'
          - 'payment:8084'
          - 'notification:8085'
          - 'review:8086'
          - 'integration:8087'
          - 'web-bff:8090'
