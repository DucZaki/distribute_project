server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        response-timeout: 60s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # PUBLIC: auth endpoints (no JWT)
        - id: identity-public
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<seg>.*), /api/v1/auth/${seg}

        # PUBLIC: OAuth2 login (Google / Facebook)
        - id: identity-oauth
          uri: lb://identity-service
          predicates:
            - Path=/oauth2/**,/login/oauth2/**,/api/oauth2/**
          filters:
            - RewritePath=/api/oauth2/(?<seg>.*), /oauth2/${seg}

        # PUBLIC: active promo codes for marketing page
        - id: booking-promo-active-public
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/promo/active
            - Method=GET
          filters:
            - RewritePath=/api/bookings/(?<seg>.*), /api/v1/bookings/${seg}

        # promo/apply → protected bookings route (cần JWT để giới hạn theo user)

        # PUBLIC: flight quote (Amadeus — có thể mất 5–30s, không dùng circuit breaker)
        - id: tour-flight-quote
          uri: lb://tour-service
          predicates:
            - Path=/api/tours/*/flight-quote
            - Method=GET
          filters:
            - RewritePath=/api/tours/(?<id>[^/]+)/flight-quote, /api/v1/tours/${id}/flight-quote

        # PUBLIC: tour images uploaded by admin
        - id: tour-uploads
          uri: lb://tour-service
          predicates:
            - Path=/uploads/**
            - Method=GET

        # PUBLIC: read-only tour browse + destinations (/api/tours and /api/tours/**)
        - id: tour-public
          uri: lb://tour-service
          predicates:
            - Path=/api/tours,/api/tours/**
            - Method=GET
          filters:
            - RewritePath=/api/tours(?<remainder>/.*)?, /api/v1/tours${remainder}
            - name: CircuitBreaker
              args:
                name: tourCB
                fallbackUri: forward:/fallback/tour

        # PUBLIC: read reviews on tour detail pages
        - id: review-public-read
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/tour/**
            - Method=GET
          filters:
            - RewritePath=/api/reviews/(?<seg>.*), /api/v1/reviews/${seg}

        # PUBLIC: danh sách tất cả đánh giá (trang chủ)
        - id: review-public-list
          uri: lb://review-service
          predicates:
            - Path=/api/reviews
            - Method=GET
          filters:
            - RewritePath=/api/reviews, /api/v1/reviews

        # PUBLIC: contact form submit
        - id: contact-public
          uri: lb://review-service
          predicates:
            - Path=/api/contacts
            - Method=POST
          filters:
            - RewritePath=/api/contacts, /api/v1/contacts

        # PROTECTED: write reviews & favorites
        - id: review-secured
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**, /api/favorites/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter

        # PROTECTED: admin dashboard BFF
        - id: admin-bff
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/dashboard/**, /api/admin/stats
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter

        # PROTECTED: review admin
        - id: review-admin
          uri: lb://review-service
          predicates:
            - Path=/api/admin/contacts/**, /api/admin/reviews/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter

        # PROTECTED: identity (profile, admin user mgmt)
        - id: identity-secured
          uri: lb://identity-service
          predicates:
            - Path=/api/users/**, /api/admin/users/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter

        # PROTECTED: tour admin write
        - id: tour-admin
          uri: lb://tour-service
          predicates:
            - Path=/api/admin/tours/**, /api/admin/destinations/**, /api/admin/schedules/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter

        # PROTECTED: bookings (check-in GET public via separate route)
        - id: booking
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**, /api/admin/bookings/**, /api/admin/promos/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: bookingCB
                fallbackUri: forward:/fallback/booking

        - id: check-in-public
          uri: lb://booking-service
          predicates:
            - Path=/api/check-in/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}

        # PROTECTED: payment
        - id: payment
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}
            - JwtAuthenticationFilter

        # PUBLIC: VNPay IPN callback (no JWT)
        - id: payment-ipn
          uri: lb://payment-service
          predicates:
            - Path=/api/vnpay/ipn, /api/vnpay/return
          filters:
            - RewritePath=/api/vnpay/(?<seg>.*), /api/v1/vnpay/${seg}

        # PUBLIC: integrations (news, flights, chat)
        - id: integration
          uri: lb://integration-service
          predicates:
            - Path=/api/news,/api/news/**,/api/flights,/api/flights/**,/api/chat,/api/chat/**
          filters:
            - RewritePath=/api/(?<seg>.*), /api/v1/${seg}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  timelimiter:
    instances:
      tourCB:
        timeoutDuration: 90s
      bookingCB:
        timeoutDuration: 60s
  circuitbreaker:
    instances:
      tourCB:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
      bookingCB:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

app:
  jwt:
    secret: ${JWT_SECRET:bookingtour-super-secret-key-change-in-prod-min-256-bits-required-aaaa}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: bookingtour

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
